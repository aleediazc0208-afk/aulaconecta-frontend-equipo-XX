<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RedSENA | Recuperar Contraseña</title>

    <link rel="stylesheet" href="CSS/responsive-login.css">

</head>

<body class="auth">

    <div class="auth-wrapper">

        <div class="auth-card">

            <img src="IMG/sena-logo.png" class="logo" alt="Logo SENA">

            <h1>Red<span>SENA</span></h1>

            <h2>Recuperar Contraseña</h2>

            <p class="descripcion">
                Ingresa tu correo electrónico institucional para recibir las instrucciones de recuperación.
            </p>

            <form>

                <input
                    type="email"
                    placeholder="Correo Electrónico"
                    required>

                <button type="submit">
                    Enviar enlace
                </button>

            </form>

            <a href="login.html" class="volver-login">
                ← Volver al inicio de sesión
            </a>

        </div>

        <div class="auth-visual">
            <div>
                <div class="emoji">🔐</div>
                <h3>¿Olvidaste tu contraseña?</h3>
                <p>No te preocupes, te enviaremos las instrucciones para recuperar el acceso a tu cuenta.</p>
            </div>
        </div>

    </div>

    <script src="JS/recuperar.js"></script>
</body>

</html>
