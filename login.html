<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RedSENA - Inicio de Sesión</title>

    <link rel="stylesheet" href="CSS/responsive-login.css">
    
</head>

<body class="auth">

    <div class="auth-wrapper">

        <div class="auth-card">

            <img src="IMG/sena-logo.png" class="logo" alt="Logo SENA">

            <h1>Red<span>SENA</span></h1>

            <h2>Inicia Sesión</h2>

            <p>Bienvenido a RedSENA</p>

            <!-- Formulario -->
            <form id="formulario">

                <input
                    type="email"
                    id="correo"
                    placeholder="Correo Electrónico"
                    required>

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required>

                <button type="submit">
                    Iniciar
                </button>

            </form>

            <br><br>

            <a href="recuperar.html">¿Olvidaste tu contraseña?</a>

            <p class="crear">
                ¿No tienes cuenta?<br>
                <a href="registro.html">Crea tu cuenta ahora</a>
            </p>

        </div>

        <div class="auth-visual">
    <div>
        <div class="emoji">🎓</div>
        <h3>Bienvenido a RedSENA</h3>
        <p>Conecta con tu comunidad académica: cafetería, emprendimientos y red social en un solo lugar.</p>
    </div>
</div>

    </div>

    <!-- Archivo JavaScript -->
    <script src="JS/script.js"></script>

</body>

</html>
