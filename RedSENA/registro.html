<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>RedSENA | Crear Cuenta</title>

    <link rel="stylesheet" href="CSS/responsive-login.css">

</head>

<body class="auth">

<div class="auth-wrapper">

    <div class="auth-card">

        <img src="IMG/sena-logo.png" class="logo" alt="Logo SENA">

        <h1>Red<span>SENA</span></h1>

        <h2>Crear Cuenta</h2>

        <p class="descripcion">
            Registra tus datos para comenzar a disfrutar de los servicios de RedSENA.
        </p>

        <form id="formulario">

            <input
                type="text"
                id="nombre"
                placeholder="Nombre Completo"
                required>

            <input
                type="email"
                id="correo"
                placeholder="Correo Electrónico"
                required>

            <input
                type="password"
                id="password"
                placeholder="Contraseña"
                required>

            <input
                type="password"
                id="confirmar"
                placeholder="Confirmar Contraseña"
                required>

            <button type="submit">
                Crear Cuenta
            </button>

        </form>

        <a href="login.html" class="volver-login">
            ← Ya tengo una cuenta
        </a>

    </div>

    <div class="auth-visual">
        <div>
            <div class="emoji">👨‍🎓</div>
            <h3>Únete a RedSENA</h3>
            <p>Crea tu cuenta y accede a cursos, emprendimientos y la comunidad de aprendices.</p>
        </div>
    </div>

</div>

<script src="JS/registro.js"></script>

</body>

</html>
